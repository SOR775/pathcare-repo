{% extends "tracking/base.html" %}

{% block title %}Password reset - Pathcare Kenya{% endblock %}

{% block content %}
<div class="hero-card">
  <div>
    <p class="eyebrow">Authentication</p>
    <h1>Reset your password</h1>
    <p>Enter the email address linked to your account and we will send reset instructions.</p>
  </div>
</div>

<section class="panel">
  <form method="post" class="filter-form" style="display:block;max-width:420px;">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Send reset email</button>
  </form>
</section>
{% endblock %}
