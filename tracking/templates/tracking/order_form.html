{% extends "tracking/base.html" %}

{% block title %}New order - Pathcare Kenya{% endblock %}

{% block content %}
<section class="panel">
  <div class="panel-header">
    <div>
      <p class="eyebrow">Create order</p>
      <h2>New pickup request</h2>
    </div>
  </div>

  <form method="post" class="form-grid">
    {% csrf_token %}
    {% for field in form %}
      <div class="field-group">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div class="field-errors">{{ field.errors|striptags }}</div>
        {% endif %}
      </div>
    {% endfor %}
    <div class="form-actions">
      <button class="button primary" type="submit">Create order</button>
      <a class="button secondary" href="{% url 'tracking:dashboard' %}">Cancel</a>
    </div>
  </form>
</section>
{% endblock %}
