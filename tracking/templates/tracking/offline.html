<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>PathCare Kenya — Offline</title>
  <meta name="theme-color" content="#0d9488">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f0fdfa;
    }

    .card {
      text-align: center;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 4px 32px rgba(15, 23, 42, .08);
      padding: 48px 36px;
      max-width: 440px;
      width: 100%;
      border: 1px solid #e2e8f0;
    }
    @media (max-width: 480px) {
      .card { padding: 36px 24px; border-radius: 16px; }
    }

    .logo {
      width: 56px; height: 56px; border-radius: 14px;
      background: linear-gradient(135deg, #0d9488, #047857);
      margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 1.4rem;
    }

    .status-dot {
      display: inline-block; width: 10px; height: 10px;
      border-radius: 50%; background: #ef4444;
      margin-right: 8px; animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    h1 {
      color: #0f172a; font-size: 1.5rem; font-weight: 800;
      letter-spacing: -0.02em; margin-bottom: 12px;
    }

    p {
      color: #475569; line-height: 1.6; font-size: .9rem;
      margin-bottom: 28px; max-width: 320px; margin-left: auto; margin-right: auto;
    }

    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 13px 32px; border-radius: 10px;
      background: #0d9488; color: #fff;
      text-decoration: none; font-weight: 700; font-size: .9rem;
      border: none; cursor: pointer; font-family: inherit;
      transition: background .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { background: #0f766e; box-shadow: 0 4px 16px rgba(13, 148, 136, .3); }
    .btn:active { transform: scale(.97); }

    .alert {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 20px; padding: 10px 16px; border-radius: 8px;
      background: #fef2f2; color: #991b1b; font-size: .8rem;
      font-weight: 600; border-left: 4px solid #ef4444;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo" aria-hidden="true">P</div>
    <h1>You're Offline</h1>
    <p>
      PathCare is currently unavailable because you're not connected to the internet.
      Please check your connection and try again.
    </p>
    <button class="btn" onclick="location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Try Again
    </button>
    <div class="alert">
      <span class="status-dot" aria-hidden="true"></span> No internet connection
    </div>
  </div>

  <script>
    window.addEventListener('online', function() {
      location.reload();
    });
  </script>
</body>
</html>
